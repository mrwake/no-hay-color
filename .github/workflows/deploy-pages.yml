name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main, test-estilos]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main site
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Check out style preview
        uses: actions/checkout@v4
        with:
          ref: test-estilos
          path: preview-source
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check project
        run: npm run check
      - name: Build site
        run: npm run build
      - name: Install preview dependencies
        run: npm ci
        working-directory: preview-source
      - name: Check preview project
        run: npm run check
        working-directory: preview-source
      - name: Build style preview
        run: npm run build
        working-directory: preview-source
        env:
          ASTRO_BASE: /test-estilos/
          ASTRO_OUT_DIR: ./dist-preview
      - name: Add preview under its own path
        run: |
          mkdir -p dist/test-estilos
          cp -R preview-source/dist-preview/. dist/test-estilos/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
